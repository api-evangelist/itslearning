apis:
- name: itslearning Organisation API
  description: SOAP web services (DataService, ReadDataService, FileService, FileStreamService,
    InstanceService) to automate workflows by managing courses, content, files and assessments on an
    itslearning site. Used for content migration, timetable synchronization and assessment updates.
  humanURL: https://developer.itslearning.com/Organisation-API.html
  baseURL: https://eu1.itslearning.com
  properties:
  - type: Documentation
    url: https://developer.itslearning.com/Organisation-API.html
- name: itslearning Data Warehouse API
  description: OData-based reporting and analytics API over a star-schema data warehouse refreshed by a
    daily overnight ETL, compatible with common BI and reporting tools. Access is granted via the
    customer's account manager.
  humanURL: https://developer.itslearning.com/Data-warehouse.html
  baseURL: https://eu1.itslearning.com
  properties:
  - type: Documentation
    url: https://developer.itslearning.com/Data-warehouse.html
- name: itslearning IMS Enterprise Services
  description: Standardized IMS Enterprise web services and SFTP XML imports to manage users, groups and
    courses (persons, memberships and groups) for provisioning and roster synchronization.
  humanURL: https://developer.itslearning.com/IMS-Enterprise-Services.html
  baseURL: https://eu1.itslearning.com
  properties:
  - type: Documentation
    url: https://developer.itslearning.com/IMS-Enterprise-Services.html
- name: itslearning LTI Integration
  description: Learning Tools Interoperability integration supporting LTI 1.3 Core and LTI Advantage
    (itslearning holds LTI Advantage Complete certification) to securely embed third-party tools and
    contribute content to the itslearning Library. LTI 1.0/1.1 deprecated since June 2022.
  humanURL: https://developer.itslearning.com/Content-and-tool-integrations.html
  baseURL: https://eu1.itslearning.com
  properties:
  - type: Documentation
    url: https://developer.itslearning.com/Content-and-tool-integrations.html
