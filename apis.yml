aid: itslearning
name: itslearning
description: 'itslearning is a Norwegian learning management system (LMS) founded in 1999 and
  headquartered in Bergen, Norway, now part of the Sanoma Learning group. Its cloud platform serves
  primary, secondary, vocational, higher education, lifelong-learning and international schools across
  Europe and beyond, giving teachers lesson planning ("Plans"), assessment and quizzing, communication,
  an AI Toolkit, administration and reporting in one place. For integrators itslearning exposes an
  Organisation API (SOAP web services for courses, content, files and assessments), a Data Warehouse
  OData reporting API, IMS Enterprise Services and SFTP imports for user/course provisioning, and
  standards-based Learning Tools Interoperability (LTI 1.3 Core and LTI Advantage, with LTI 1.0/1.1
  deprecated since June 2022) for third-party tool and content integration into the itslearning Library.'
